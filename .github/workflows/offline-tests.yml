name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: umask 022 && python -B run_offline_tests.py --inventory "$RUNNER_TEMP/pytest-nodeids.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: pytest-nodeids-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-nodeids.txt
          if-no-files-found: error
      - name: Check legacy dashboard in headless Chrome
        run: umask 022 && python -B -m browser_tests.legacy_dashboard --check legacy
      - name: Check pilot 503 pages in headless Chrome
        run: umask 022 && python -B -m browser_tests.legacy_dashboard --check pilot
      - name: Compare collected tests with the last successful run
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_BRANCH: ${{ github.base_ref || github.ref_name }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          LC_ALL: C
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow offline-tests.yml \
            --branch "$BASELINE_BRANCH" --status success --limit 30 --json databaseId,number,event \
            --jq "map(select(.number < $GITHUB_RUN_NUMBER and .event != \"pull_request\")) | first | .databaseId // empty")
          if [[ -z "$run" ]]; then
            echo 'Test inventory comparison: no previous successful branch run.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=pytest-nodeids-$PYTHON_VERSION" \
            --jq '.artifacts[] | select(.expired == false) | .id')
          if [[ -z "$artifact" ]]; then
            echo "Test inventory comparison: run $run has no inventory for Python $PYTHON_VERSION." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          baseline=$(mktemp -d "$RUNNER_TEMP/inventory-baseline.XXXXXX")
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "pytest-nodeids-$PYTHON_VERSION" --dir "$baseline"
          python -B compare_inventories.py "$baseline/pytest-nodeids.txt" \
            "$RUNNER_TEMP/pytest-nodeids.txt" --label "vs run $run / Python $PYTHON_VERSION" > "$baseline/comparison.txt"
          cat "$baseline/comparison.txt"
          cat "$baseline/comparison.txt" >> "$GITHUB_STEP_SUMMARY"
