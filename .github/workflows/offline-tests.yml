name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -B run_offline_tests.py --inventory "$RUNNER_TEMP/pytest-nodeids.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pytest-nodeids
          path: ${{ runner.temp }}/pytest-nodeids.txt
          if-no-files-found: error
      - name: Check legacy dashboard in headless Chrome
        run: python -B -m browser_tests.legacy_dashboard
