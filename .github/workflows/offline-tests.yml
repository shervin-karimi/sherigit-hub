name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: umask 022 && python -B run_offline_tests.py --inventory "$RUNNER_TEMP/pytest-nodeids.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: pytest-nodeids-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-nodeids.txt
          if-no-files-found: error
      - name: Check legacy dashboard in headless Chrome
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          echo "#### Legacy dashboard (Python ${{ matrix.python-version }})" | tee -a "$GITHUB_STEP_SUMMARY"
          umask 022
          python -B -m browser_tests.legacy_dashboard --check legacy 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check pilot success page in headless Chrome
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          echo "#### Pilot success page (Python ${{ matrix.python-version }})" | tee -a "$GITHUB_STEP_SUMMARY"
          umask 022
          python -B -m browser_tests.legacy_dashboard --check success 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check pilot 503 pages in headless Chrome
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          echo "#### Pilot 503 pages (Python ${{ matrix.python-version }})" | tee -a "$GITHUB_STEP_SUMMARY"
          umask 022
          python -B -m browser_tests.legacy_dashboard --check pilot 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare collected tests with the last successful run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_BRANCH: ${{ github.base_ref || github.ref_name }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          LC_ALL: C
        run: |
          set -o pipefail
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow offline-tests.yml \
            --branch "$BASELINE_BRANCH" --status success --limit 30 --json databaseId,number,event \
            --jq "map(select(.number < $GITHUB_RUN_NUMBER and .event != \"pull_request\")) | first | .databaseId // empty")
          baseline=$(mktemp -d "$RUNNER_TEMP/inventory-baseline.XXXXXX")
          baseline_file="$baseline/missing-baseline.txt"
          if [[ -n "$run" ]]; then
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=pytest-nodeids-$PYTHON_VERSION" \
              --jq '.artifacts[] | select(.expired == false) | .id')
            if [[ -n "$artifact" ]]; then
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "pytest-nodeids-$PYTHON_VERSION" --dir "$baseline"
              baseline_file="$baseline/pytest-nodeids.txt"
            fi
          fi
          code=0
          python -B compare_inventories.py "$baseline_file" \
            "$RUNNER_TEMP/pytest-nodeids.txt" --label "vs run ${run:-none} / Python $PYTHON_VERSION" \
            --baseline-run "${run:-none}" > "$baseline/comparison.txt" || code=$?
          tee -a "$GITHUB_STEP_SUMMARY" < "$baseline/comparison.txt"
          exit "$code"
